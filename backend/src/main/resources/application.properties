server.port=${PORT:8080}
server.servlet.context-path=/

# TiDB Cloud Serverless Connection (MySQL 8.0 Protocol Compatible)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/zenelait_crm_db?useSSL=true&sslMode=PREFERRED&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:39cvqCbWgDDRSED.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:d60IRHbBw3vGBWSv}

# Hikari Connection Pool Optimization for Cloud Database Latency
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12

# SQL Schema Initialization
spring.sql.init.mode=never

# JWT Security Secrets & Expiration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.zenelait.crm=INFO
